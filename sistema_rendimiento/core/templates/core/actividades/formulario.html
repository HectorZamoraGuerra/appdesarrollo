{% extends "core/base.html" %}

{% block title %}Editar actividad · Sistema de Rendimiento{% endblock %}

{% block content %}
<div class="modal-backdrop">
    <div class="modal" role="dialog" aria-labelledby="modal-titulo">
        <div class="modal-header">
            <div>
                <p class="modal-eyebrow">Editar actividad</p>
                <h2 id="modal-titulo">{{ object }}</h2>
            </div>
            <a href="{% url 'core:actividad_detalle' object.pk %}" class="modal-close" aria-label="Cerrar">✕</a>
        </div>

        <form class="modal-body" id="form-actividad" method="post">
            {% csrf_token %}
            {{ form.as_p }}
        </form>

        <div class="modal-footer">
            <a href="{% url 'core:actividad_detalle' object.pk %}" class="btn">Cancelar</a>
            <button type="submit" form="form-actividad" class="btn btn-primary">Guardar cambios</button>
        </div>
    </div>
</div>
{% endblock %}
